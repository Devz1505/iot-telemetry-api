name: Firmware

# Compiles the ESP32 sketch whenever it changes. Proves the firmware builds
# against the official Espressif core; it does not flash any hardware.
on:
  push:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/**', '.github/workflows/firmware.yml']

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use placeholder secrets for the build
        run: cp firmware/esp32_telemetry_client/secrets.example.h firmware/esp32_telemetry_client/secrets.h

      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: 3.3.12
          libraries: |
            - name: DHT sensor library
            - name: Adafruit Unified Sensor
          sketch-paths: |
            - firmware/esp32_telemetry_client
