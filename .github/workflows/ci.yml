name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compiles, runs all unit + integration tests, and packages the jar.
      - name: Build and test
        run: mvn -B verify

      - name: Check the simulator script compiles
        run: python3 -m py_compile tools/simulate_device.py
