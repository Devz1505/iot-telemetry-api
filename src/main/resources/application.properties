spring.application.name=iot-telemetry-api
server.port=8080

# --- Database (default profile): in-memory H2, zero setup ---------------------
# Data is lost on restart. Run with the "postgres" profile to keep it.
spring.datasource.url=jdbc:h2:mem:telemetry;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Browse the tables at http://localhost:8080/h2-console (JDBC URL above)
spring.h2.console.enabled=true

# Keep database access inside the service layer's transactions; lazy
# loading from a controller or view fails fast instead of silently
# running extra queries.
spring.jpa.open-in-view=false

# --- Ops ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info

# Interactive API docs: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
