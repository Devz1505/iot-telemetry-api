# Activate with:  mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# One-time setup (creates the app's own login + database): see README, "With PostgreSQL".

# Credentials live in local/db.properties (git-ignored) or in DB_* environment variables.
spring.config.import=optional:file:./local/db.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/telemetry}
spring.datasource.username=${DB_USER:telemetry_app}
spring.datasource.password=${DB_PASSWORD:}

# "update" adds missing tables/columns but never drops data. Fine for a
# project like this; production systems use versioned migrations (Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
